server:
  port: 8200

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        refresh-enabled: false
        import-check:
          enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          httpclient:
            connect-timeout: 3000
            response-timeout: 60s

gateway:
  cors:
    allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:}
  upstreams:
    canvas: ${GATEWAY_CANVAS_URI:lb://canvas-service}
    iam: ${GATEWAY_IAM_URI:lb://iam-service}
    user: ${GATEWAY_USER_URI:lb://user-service}
    access: ${GATEWAY_ACCESS_URI:lb://access-service}
    billing: ${GATEWAY_BILLING_URI:lb://billing-service}
    payment: ${GATEWAY_PAYMENT_URI:lb://payment-service}
    storage: ${GATEWAY_STORAGE_URI:lb://storage-service}
    media: ${GATEWAY_MEDIA_URI:lb://media-service}
    promotion: ${GATEWAY_PROMOTION_URI:lb://promotion-service}
    operations: ${GATEWAY_OPERATIONS_URI:lb://operations-service}

management:
  endpoints:
    web:
      exposure:
        include: health
