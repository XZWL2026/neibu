spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
        import-check:
          enabled: false
  application:
    name: promotion-service
  datasource:
    url: ${PROMOTION_DB_URL}
    username: ${PROMOTION_DB_USERNAME}
    password: ${PROMOTION_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${PROMOTION_DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8213
mybatis-plus:
  configuration:
    local-cache-scope: statement

xzwl:
  iam-session:
    enabled: true
    base-url: ${PROMOTION_IAM_SERVICE_URL:http://127.0.0.1:8210}
