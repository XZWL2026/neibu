# TEST 124 server block: replace the existing admin/API SPA locations with these.
# Validate/reload as the systemd service user, xzwl-test. Running nginx -t as
# root can change temporary directory ownership to nobody and break uploads.
# Keep the existing /admin/api/, /api/session/api/, and /admin/assets/ locations.
# /index.html must be a file candidate, not the final internal-redirect target:
# an internal redirect reselects location / and serves the user application.
location ~ ^/(?:admin|promoter|agent)(?:/|$) {
    root /opt/xzwl-test-124/current/web/admin;
    try_files $uri /index.html =404;
}
location ~ ^/api/(?:login|portal-entry|dashboard|keys|consumption|billing|transfer|docs|account)(?:/|$) {
    root /opt/xzwl-test-124/current/web/admin;
    try_files $uri /index.html =404;
}
