resolver 127.0.0.11 ipv6=off valid=30s;
map $request_uri $xzwl_scope {
    default USER;
    ~^/admin/api/ ADMIN;
    "~^/agent/[0-9a-f]{32}/api/" AGENT;
}
map $request_uri $xzwl_cookie_path {
    default /;
    ~^/admin/api/ /admin;
    "~^(?<xzwl_agent_path>/agent/[0-9a-f]{32})/api/" $xzwl_agent_path;
}
map $xzwl_scope $xzwl_session {
    default $cookie_xzwl_user_session;
    ADMIN $cookie_xzwl_admin_session;
    AGENT $cookie_xzwl_agent_session;
}
map $xzwl_session $xzwl_upstream_cookie {
    "" "";
    default "XZWL_SESSION=$xzwl_session";
}
map $upstream_http_set_cookie $xzwl_browser_cookie {
    default "";
    "~^XZWL_SESSION=(?<xzwl_value>[^;]*)(?<xzwl_before_path>.*?);\\s*Path=/(?<xzwl_after_path>;.*)?$"
        "XZWL_${xzwl_scope}_SESSION=$xzwl_value$xzwl_before_path; Path=$xzwl_cookie_path$xzwl_after_path";
}
map $cookie_xzwl_api_session $aiyomio_api_upstream_cookie {
    default "XZWL_SESSION=$cookie_xzwl_api_session";
    "" "";
}
map $upstream_http_set_cookie $aiyomio_api_browser_cookie {
    default $upstream_http_set_cookie;
    "~^XZWL_SESSION=(?<aiyomio_api_value>[^;]*);(?<aiyomio_api_before>.*?)Path=[^;]*(?<aiyomio_api_after>.*)$"
        "XZWL_API_SESSION=$aiyomio_api_value;${aiyomio_api_before}Path=/api${aiyomio_api_after}";
}
server {
    listen 8080;
    server_name localhost;
    root /srv/user;
    set $local_gateway host.docker.internal:8200;
    client_max_body_size 1024m;
    location / { try_files $uri $uri/ /index.html; }
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $xzwl_upstream_cookie;
    proxy_hide_header Set-Cookie;
    add_header Set-Cookie $xzwl_browser_cookie always;
    proxy_next_upstream off;
    proxy_redirect off;
    location ^~ /api/session/api/ {
        rewrite ^/api/session(/api/.*)$ $1 break;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $aiyomio_api_upstream_cookie;
        proxy_hide_header Set-Cookie;
        add_header Set-Cookie $aiyomio_api_browser_cookie always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://$local_gateway;
    }
    location ~ "^/(?:admin|agent/[0-9a-f]{32})/api/(?:v1|platform)/" {
        rewrite "^/(?:admin|agent/[0-9a-f]{32})(/api/.*)$" $1 break;
        proxy_pass http://$local_gateway;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
    location /api/v1/ {
        proxy_pass http://$local_gateway;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
    }
    location = /admin { return 302 /admin/overview; }
    location = /admin/ { return 302 /admin/overview; }
    location = /api { return 302 /api/dashboard; }
    location = /api/ { return 302 /api/dashboard; }
    location ~ "^/(?:admin/|agent/[0-9a-f]{32}/|promoter(?:/|$)|api/(?:dashboard|keys|consumption|billing|transfer|docs|account|login|portal-entry)(?:/|$))" {
        root /srv/admin;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }
    location /assets/ { try_files $uri @admin_assets; }
    location @admin_assets {
        root /srv/admin;
        try_files $uri =404;
    }
    location /callbacks/ {
        proxy_pass http://$local_gateway;
        proxy_set_header Host $http_host;
    }
}
server {
    listen 8082;
    server_name localhost;
    root /srv/partner;
    set $local_gateway host.docker.internal:8200;
    proxy_set_header Cookie $xzwl_upstream_cookie;
    proxy_hide_header Set-Cookie;
    add_header Set-Cookie $xzwl_browser_cookie always;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_pass http://$local_gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $xzwl_upstream_cookie;
    }
}
