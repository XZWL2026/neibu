name: xzwl-clean-local
services:
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:?Run prepare first}
      TZ: Asia/Shanghai
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_ai_ci, --lower-case-table-names=1]
    ports: ["127.0.0.1:23306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./target/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -Nse "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7.0.15-alpine
    restart: unless-stopped
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    ports: ["127.0.0.1:26379:6379"]
    volumes:
      - redis-data:/data
      - ./target/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./target/.env.redis-password:/usr/local/etc/redis/password:ro
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /usr/local/etc/redis/password) redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 20
  nacos:
    image: nacos/nacos-server:v2.5.4
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_local
      MYSQL_SERVICE_USER: xzwl_local
      MYSQL_SERVICE_PASSWORD: ${LOCAL_DB_PASSWORD:?Run prepare first}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=5000&socketTimeout=10000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${LOCAL_NACOS_AUTH_TOKEN:?Run prepare first}
      NACOS_AUTH_IDENTITY_KEY: xzwl-local
      NACOS_AUTH_IDENTITY_VALUE: ${LOCAL_NACOS_IDENTITY:?Run prepare first}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports: ["127.0.0.1:28848:8848", "127.0.0.1:29848:9848"]
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness']
      interval: 10s
      timeout: 5s
      retries: 40
  nginx:
    image: nginx:1.24.0-alpine
    restart: unless-stopped
    profiles: [web]
    ports: ["127.0.0.1:18090:8080", "127.0.0.1:18092:8082"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontends/user-web/dist:/srv/user:ro
      - ../../frontends/admin-web/dist:/srv/admin:ro
      - ../../frontends/partner-web/dist:/srv/partner:ro
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/']
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
