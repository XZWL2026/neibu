# Include inside the existing aiyomio.cn TLS server, before its SPA regex.
# Keep the existing user, admin, agent, assets, and business API locations.
location ^~ /api/session/api/ {
    rewrite ^/api/session(/api/.*)$ $1 break;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $aiyomio_api_upstream_cookie;
    proxy_hide_header Set-Cookie;
    add_header Set-Cookie $aiyomio_api_browser_cookie always;
    add_header Cache-Control "no-store" always;
    proxy_pass http://172.31.218.43:8200;
}
location = /api { return 302 /api/dashboard; }
location = /api/ { return 302 /api/dashboard; }
location ~ ^/api/(?:login|portal-entry)(?:/|$) {
    root /opt/xzwl/current/frontends/admin;
    try_files /index.html =404;
    add_header Cache-Control "no-store" always;
}
