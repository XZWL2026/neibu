# http context; target: aiyomio.cn / EDGE 47.97.85.146 only.
map $cookie_xzwl_api_session $aiyomio_api_upstream_cookie {
    default "XZWL_SESSION=$cookie_xzwl_api_session";
    "" "";
}
map $upstream_http_set_cookie $aiyomio_api_browser_cookie {
    default $upstream_http_set_cookie;
    "~^XZWL_SESSION=(?<aiyomio_api_value>[^;]*);(?<aiyomio_api_before>.*?)Path=[^;]*(?<aiyomio_api_after>.*)$" "XZWL_API_SESSION=$aiyomio_api_value;${aiyomio_api_before}Path=/api${aiyomio_api_after}";
}
